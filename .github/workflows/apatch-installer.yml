name: APatch Installer for Samsung

on:
  workflow_dispatch:
    inputs:
      superkey:
        description: 'APatch Super Key'
        required: true
        type: string
      mediafire_url:
        description: 'MediaFire download URL'
        required: true
        type: string
        default: 'https://www.mediafire.com/file/example/boot.img/file'

jobs:
  apatch-installer:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up environment
      run: |
        sudo apt update -y
        sudo apt install lz4 openssl python3 python3-pip python-is-python3 wget curl -y
        pip install requests
        chmod +x bin/*
        
    - name: Download from MediaFire
      run: |
        # Create Python script for MediaFire download
        cat > mediafire_download.py << 'EOF'
        import requests
        import re
        import sys
        import os
        
        def download_mediafire(url, output_path="boot.img"):
            try:
                session = requests.Session()
                session.headers.update({
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                })
                
                # Get the initial page
                print(f"Fetching: {url}")
                response = session.get(url)
                response.raise_for_status()
                
                # Try to find the direct download link using multiple patterns
                patterns = [
                    r'aria-label="Download file"\s+href="([^"]+)"',
                    r'id="downloadButton"\s+href="([^"]+)"',
                    r'class="download_link"[^>]+href="([^"]+)"',
                    r'https?://download\d+\.mediafire\.com/[^\'"\s<>]+',
                    r'kNO\s*=\s*"([^"]+)"',
                ]
                
                download_url = None
                for pattern in patterns:
                    matches = re.findall(pattern, response.text, re.IGNORECASE)
                    if matches:
                        download_url = matches[0]
                        print(f"Found download URL with pattern: {download_url}")
                        break
                
                if not download_url:
                    # Try to extract from JavaScript variables
                    js_patterns = [
                        r'var\s+downloadUrl\s*=\s*["\']([^"\']+)["\']',
                        r'downloadUrl\s*:\s*["\']([^"\']+)["\']',
                    ]
                    for pattern in js_patterns:
                        matches = re.findall(pattern, response.text, re.IGNORECASE)
                        if matches:
                            download_url = matches[0]
                            print(f"Found download URL in JS: {download_url}")
                            break
                
                if not download_url:
                    print("Could not find download URL in page content")
                    print("Trying common MediaFire URL patterns...")
                    # Try to construct download URL from file ID
                    file_id_match = re.search(r'file/([a-z0-9]+)', url)
                    if file_id_match:
                        file_id = file_id_match.group(1)
                        download_url = f"https://download.mediafire.com/{file_id}"
                        print(f"Trying constructed URL: {download_url}")
                
                if not download_url:
                    print("Page content for debugging:")
                    print(response.text[:1000])
                    return False
                
                # Download the file
                print(f"Downloading from: {download_url}")
                response = session.get(download_url, stream=True)
                response.raise_for_status()
                
                # Get filename from Content-Disposition or URL
                filename = output_path
                if 'content-disposition' in response.headers:
                    cd = response.headers['content-disposition']
                    filename_match = re.search(r'filename="([^"]+)"', cd)
                    if filename_match:
                        filename = filename_match.group(1)
                
                # Save the file
                print(f"Saving as: {filename}")
                with open(filename, 'wb') as f:
                    for chunk in response.iter_content(chunk_size=8192):
                        if chunk:
                            f.write(chunk)
                
                print(f"Download completed: {filename}")
                return True
                
            except Exception as e:
                print(f"Error downloading file: {e}")
                return False
        
        if __name__ == "__main__":
            if len(sys.argv) < 2:
                print("Usage: python mediafire_download.py <url> [output]")
                sys.exit(1)
            
            url = sys.argv[1]
            output = sys.argv[2] if len(sys.argv) > 2 else "boot.img"
            success = download_mediafire(url, output)
            sys.exit(0 if success else 1)
        EOF
        
        # Run the download script
        python mediafire_download.py "${{ inputs.mediafire_url }}" boot.img
        
        # If Python method fails, try wget with direct URL pattern
        if [ ! -f "boot.img" ]; then
          echo "Python method failed, trying alternative approach..."
          
          # Extract file ID from URL
          FILE_ID=$(echo "${{ inputs.mediafire_url }}" | grep -o 'file/[a-zA-Z0-9]\{11\}' | cut -d'/' -f2)
          
          if [ -n "$FILE_ID" ]; then
            echo "Trying direct download with file ID: $FILE_ID"
            wget -O boot.img "https://download.mediafire.com/$FILE_ID" || true
          fi
        fi
        
        # Check if download was successful
        if [ ! -f "boot.img" ]; then
          echo "::error::Failed to download boot image from MediaFire"
          echo "Please check:"
          echo "1. The MediaFire URL is correct and public"
          echo "2. The file is not password protected"
          echo "3. Try using a direct download link instead"
          exit 1
        fi
        
        echo "Download successful! File size: $(du -h boot.img | cut -f1)"

    - name: Create workspace
      run: mkdir -p workspace kpatch

    - name: Extract boot image (if compressed)
      run: |
        if [ -f "boot.img.lz4" ]; then
          lz4 -B6 --content-size -f "boot.img.lz4" "boot.img"
        fi
        
        if [ ! -f "boot.img" ]; then
          echo "::error::Boot image not found after download and extraction!"
          exit 1
        fi

    - name: Copy boot image to workspace
      run: cp "boot.img" workspace/

    - name: Generate signing key
      run: |
        cd workspace
        openssl genrsa -f4 -out sign.pem 4096

    - name: Unpack boot image
      run: |
        cd workspace
        ../bin/magiskboot unpack boot.img

    - name: Patch Samsung RKP
      run: |
        cd workspace
        ../bin/magiskboot hexpatch kernel 49010054011440B93FA00F71E9000054010840B93FA00F7189000054001840B91FA00F7188010054 A1020054011440B93FA00F7140020054010840B93FA00F71E0010054001840B91FA00F7181010054
        ../bin/magiskboot hexpatch kernel 290E0054011440B93FA00F71C90D0054010840B93FA00F71690D0054001840B91FA00F71090D0054 41030054011440B93FA00F71E0020054010840B93FA00F7180020054001840B91FA00F7120020054

    - name: Patch Samsung DEFEX
      run: |
        cd workspace
        ../bin/magiskboot hexpatch kernel 821B8012 E2FF8F12
        ../bin/magiskboot hexpatch kernel 736B69705F696E697472616D667300 77616E745F696E697472616D667300

    - name: Move kernel for patching
      run: mv workspace/kernel kpatch/

    - name: Apply APatch kernel patch
      run: |
        cd kpatch
        ../bin/kptools-linux -p -i kernel -k ../bin/kpimg-android -s "${{ inputs.superkey }}" -o image-patched
        
        if [ ! -f "image-patched" ]; then
          echo "::error::Kernel patch failed!"
          exit 1
        fi

    - name: Move patched kernel back
      run: |
        mv kpatch/image-patched workspace/kernel
        rm -rf kpatch/

    - name: Repack boot image
      run: |
        cd workspace
        ../bin/magiskboot repack boot.img

    - name: Sign boot image
      run: |
        cd workspace
        python3 ../bin/avbtool extract_public_key --key sign.pem --output sign.pub.bin
        python3 ../bin/avbtool add_hash_footer --partition_name boot --partition_size $(wc -c new-boot.img | cut -f 1 -d ' ') --image new-boot.img --key sign.pem --algorithm SHA256_RSA4096

    - name: Move final image
      run: |
        mv workspace/new-boot.img boot-patched.img

    - name: Upload patched boot image
      uses: actions/upload-artifact@v4
      with:
        name: patched-boot-image
        path: boot-patched.img

    - name: Cleanup
      run: rm -rf workspace/ kpatch/ boot.img boot.img.lz4 mediafire_download.py
